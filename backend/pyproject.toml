[project]
name = "alphapoly-backend"
version = "0.1.0"
description = "Polymarket alpha detection API and ML pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    # Console output
    "rich>=13.0.0",
    # API
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    "watchfiles>=0.21.0",
    # Trading
    "eth-account>=0.13.7",
    "web3>=7.15.0",
    "cryptography>=48.0.1",
    # Deposit-wallet (sigtype-3) trading SDK — pinned (beta, money path)
    "polymarket-client==0.1.0b8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "core"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must be called before routers are imported (they read env vars at module level)
"server/main.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
